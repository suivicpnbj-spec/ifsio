# Reverse proxy nginx pour CNTRSS (TLS devant le serveur Node).
# Le serveur Node n'expose que 127.0.0.1:3000 ; HTTPS est terminé ici.
# Certificat : certbot --nginx -d cntrss.bj (ou équivalent Let's Encrypt).

server {
    listen 80;
    server_name cntrss.bj www.cntrss.bj;
    return 301 https://cntrss.bj$request_uri;
}

server {
    listen 443 ssl http2;
    server_name cntrss.bj;

    ssl_certificate     /etc/letsencrypt/live/cntrss.bj/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cntrss.bj/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Les PDF déposés pèsent jusqu'à 15 Mo : aligné sur MAX_UPLOAD_BYTES.
    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Express doit faire confiance à ce saut (TRUST_PROXY=1) pour que le
        # rate limiting par IP et le journal d'audit voient la vraie IP.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
