    function charger_les_filieres(diplome) {
      $url = "https://ifsio.bj/"+'services/donnees/filieres/charger';
      data = new FormData();
      data.append("diplome", diplome);    
      show_loading();
      $.ajax({
         url: $url,
         data: data,
         cache: false,
         contentType: false,
         dataType:'JSON',
         processData: false,
         type: 'POST',
          success: function(data){
            console.log("data")
            console.log(data)  
            if (data.filieres) {
              $("select[name=parcours_filiere]").find('option').remove()
              for (var i = 0; i < data.filieres.length; i++) {
                 
                $("select[name=parcours_filiere]").append("<option value='"+data.filieres[i].id+"'>"+data.filieres[i].filiere+"</option>")
                 
                
              }
            }
                
          },
          error: function(jqXHR, textStatus, errorThrown) {
           console.log(jqXHR.responseText+" "+errorThrown);
          }
      }); 
    }
